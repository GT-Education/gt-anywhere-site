<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('gt-anywhere-form');
    if (!form) return console.error('Form element #gt-anywhere-form not found');

    form.addEventListener(
      'submit',
      async function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();

        var eventId =
          window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : 'lead-' + Date.now() + '-' + Math.random().toString(36).slice(2);

        const getValue = (name) => form.querySelector(`[name="${name}"]`)?.value || '';
        const getChecked = (name) => form.querySelector(`[name="${name}"]`)?.checked || false;

        const payload = {
          first_name: getValue('first_name'),
          last_name: getValue('last_name'),
          email: getValue('email'),
          phone: getValue('phone'),
          zip_code: getValue('zip_code'),
          sms_consent: getChecked('sms_consent'),
          source_url: window.location.href,
          event_id: eventId,
        };

        const submitBtn = form.querySelector('input[type="submit"], .w-button');
        const originalBtnText = submitBtn ? submitBtn.value : 'Submit';
        if (submitBtn) submitBtn.value = 'Sending...';

        try {
          const res = await fetch('https://gjemyeaikpbulvdwkjxv.supabase.co/functions/v1/partner-lead-webhook', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': 'pk_partner_1d9784e65e797821a10b8b959cde322617492daf05bb16f0',
            },
            body: JSON.stringify(payload),
          });

          const result = await res.json();

          if (result.success) {
            var leadValue = 10;

            // GA4 — key conversion event for the interest form
            if (typeof gtag === 'function') {
              gtag('event', 'generate_lead', {
                currency: 'USD',
                value: leadValue,
                lead_source: 'gt_anywhere_interest_form',
                event_id: eventId,
                transaction_id: eventId,
              });
            }

            // Meta Pixel — Lead, with eventID for Conversions API dedup
            if (typeof fbq === 'function') {
              fbq(
                'track',
                'Lead',
                { content_name: 'GT Anywhere Lead', value: leadValue, currency: 'USD' },
                { eventID: eventId },
              );
            }

            // TikTok — Lead, with event_id for dedup
            if (typeof ttq !== 'undefined') {
              ttq.track('Lead', {
                contents: [{ content_id: 'lead', content_type: 'product', content_name: 'GT Anywhere Lead' }],
                value: leadValue,
                currency: 'USD',
                event_id: eventId,
              });
            }

            await new Promise((r) => setTimeout(r, 500));
            window.location.assign('https://apply.gt.school/#/dashboard');
          } else {
            alert(result.error || 'Submission failed');
            if (submitBtn) submitBtn.value = originalBtnText;
          }
        } catch (err) {
          console.error('Fetch error:', err);
          alert('Something went wrong.');
          if (submitBtn) submitBtn.value = originalBtnText;
        }
      },
      true,
    );
  });
</script>
